name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Lint API (ruff)
        working-directory: apps/api
        run: ruff check app tests

      - name: Run API & Rules test suite (pytest)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://cadence:cadence@localhost:5432/cadence
          APP_NOW: "2026-11-11T15:00:00Z"
          CLOCK_MODE: frozen
        run: pytest -v

      - name: Verify rules_report.json parity
        env:
          DATABASE_URL: postgresql+psycopg://cadence:cadence@localhost:5432/cadence
          APP_NOW: "2026-11-11T15:00:00Z"
          CLOCK_MODE: frozen
        run: |
          cd apps/api
          python -c "from sqlalchemy import text; from app.db import SessionLocal; from app.cli.seed import seed_database; db = SessionLocal(); db.execute(text('TRUNCATE TABLE meeting_summaries, meeting_ratings, meeting_attendees, todos, issues, meetings, milestones, rocks, scores, measurables, memberships, users, teams, companies RESTART IDENTITY CASCADE')); db.commit(); seed_database(db); db.close()"
          python -m app.cli.report > /tmp/ci_rules_report.json
          diff -u ../../rules_report.json /tmp/ci_rules_report.json

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Typecheck Web (tsc --noEmit)
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
