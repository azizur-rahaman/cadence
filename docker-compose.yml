services:
  db:
    image: postgres:16-alpine
    container_name: cadence-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence}
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cadence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadence} -d ${POSTGRES_DB:-cadence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cadence-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cadence:cadence@db:5432/cadence}
      APP_NOW: ${APP_NOW:-2026-11-11T15:00:00Z}
      CLOCK_MODE: ${CLOCK_MODE:-live}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-America/Chicago}
      AUTH_SECRET: ${AUTH_SECRET:-cadence-local-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: cadence-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cadence_pgdata:
